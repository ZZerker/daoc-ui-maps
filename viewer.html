<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map, DAoC UI maps</title>
<meta name="description" content="Zoomable rendered Dark Age of Camelot zone map with coordinates, labels and levels.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M7 8v10a4 4 0 0 0 8 0V8M20 8v16' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/TokaFontRegular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page">
<header class="bar" id="bar">
  <div class="column bar-inner">
    <a class="brand" href="./" id="brand">
      <svg class="mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v9a4 4 0 0 0 8 0V5M17 5v14" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
      <span class="wordmark">DAoC UI maps</span>
    </a>
    <nav class="bar-nav" aria-label="Main">
      <a href="./" data-nav="maps" aria-current="page">Maps</a>
      <a href="./#downloads" data-nav="downloads">Downloads</a>
      <a class="bar-github" href="https://github.com/ZZerker/daoc-ui-maps">GitHub</a>
    </nav>
  </div>
</header>

<main class="viewer" id="main">
  <div class="stage">
    <a class="pill map-back" id="map-back" href="./"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>All maps</a>
    <div class="map" id="map" role="region" aria-label="Map"></div>
  </div>
  <aside class="panel" id="panel" aria-label="Zone details">
    <div id="client-switch"></div>
    <h1 id="zone-name">Loading the map</h1>
    <p class="zone-line" id="zone-line"></p>
    <div id="panel-body"></div>
  </aside>
</main>

<footer class="column foot">
  <div class="foot-brand">
    <svg class="mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v9a4 4 0 0 0 8 0V5M17 5v14" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
    <span class="wordmark">DAoC UI maps</span>
  </div>
  <p class="meta">Maps rendered with DAoC MapCreator from the game client files. Not affiliated with Broadsword or Electronic Arts.</p>
  <p class="foot-links">
    <a href="https://github.com/ZZerker/daoc-ui-maps">GitHub</a>
    <a href="https://github.com/ZZerker/DAoC-MapCreator">MapCreator</a>
  </p>
</footer>

<noscript><p class="column meta">This page needs JavaScript to show the map.</p></noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
